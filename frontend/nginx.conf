server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A small, honestly-scoped set of headers (same reasoning as the
    # backend's SecurityHeadersMiddleware — see app/core/middleware.py).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA client-side routing: any path that isn't a real static file falls
    # back to index.html so React Router handles it. Without this, a hard
    # refresh on e.g. /workspace would 404 at the nginx layer instead of
    # ever reaching the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (dist/assets/*) are safe to cache aggressively —
    # Vite fingerprints filenames on content change, so a stale cache can
    # never serve stale code. index.html itself is NOT covered by this
    # block (it's served by the location / block above with nginx's
    # default, much shorter caching) since it's what points at the current
    # hashed asset names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
