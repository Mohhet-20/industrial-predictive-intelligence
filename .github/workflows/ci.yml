# CI pipeline. Every step here mirrors scripts/ci_check.sh exactly — that
# script is what was actually run and validated locally (see
# docs/RELIABILITY_AND_OPERATIONS.md §16 and for the real output). This
# workflow file has NOT itself been executed by GitHub Actions in this
# environment: the repository has no git remote/CI runner attached here.
# It is real, runnable configuration for when this repo is pushed to
# GitHub — not a claim that a pipeline has actually run and gone green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migrations apply cleanly to a fresh database
        env:
          DATABASE_URL: "sqlite:////tmp/ci_pred_platform.db"
          JWT_SECRET_KEY: "ci-github-actions-secret-not-for-production-use-only"
        run: |
          alembic upgrade head
          alembic check
      - name: Run backend test suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: "ci-github-actions-secret-not-for-production-use-only"
        run: python -m pytest -q
      - name: Dependency vulnerability scan (informational)
        run: |
          pip install -q pip-audit
          pip-audit || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Dependency vulnerability scan (informational)
        run: npm audit || true
